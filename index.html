<!-- ═══════════════════════════════════════════════════════════════
     LUMI — CINEMATIC HERO
     Inspired by lumilol.png direction. Built with CSS layers.
     ═══════════════════════════════════════════════════════════════ -->
<style>
/* ── HERO CONTAINER ── */
.lumi-hero {
  position: relative;
  width: 100%;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  overflow: hidden;
  z-index: 1;
}

.lumi-hero-video {
  position: absolute;
  top: 15%; /* Movido para mais perto do topo */
  left: 50%;
  transform: translate(-50%, 0);
  width: 100%;
  max-width: 800px; /* Vídeo bem menor para não cortar nada */
  height: auto;
  object-fit: contain;
  z-index: 0;
  pointer-events: none;
  
  /* Máscara muito mais agressiva no topo e base para um efeito de flutuação dinâmica e esfumaçado perfeito */
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 70%, transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 70%, transparent 100%);

  /* Fade-in Limpo (Sem blur para não travar em alguns navegadores/mobile) */
  opacity: 0;
  animation: lumiCleanVideoEntrance 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  -webkit-animation: lumiCleanVideoEntrance 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes lumiCleanVideoEntrance {
  0% {
    opacity: 0;
    transform: translate(-50%, 0) scale(1.05);
  }
  100% {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }
}

.lumi-hero-video--mobile {
  display: none;
}

/* ── RESPONSIVE — MOBILE FIRST ── */
@media (max-width: 768px) {
  .lumi-hero-video--desktop {
    display: none !important;
  }
  .lumi-hero-video--mobile {
    display: block !important;
    max-width: 100%;
    width: 100%;
    height: 85vh; /* Ocupa quase toda a tela */
    object-fit: cover; /* Garante que o vídeo preencha sem distorcer */
    top: 50%; /* Centraliza na tela */
    transform: translate(-50%, -50%);
    
    /* Máscara muito mais intensa para o mobile (Efeito holograma flutuante e suave nas pontas) */
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
  }

  /* Ajuste no Fade-in para Mobile (mantendo o translate-Y centrado) */
  @keyframes lumiCleanVideoEntrance {
    0% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.05);
    }
    100% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  }
}


/* ── SCROLL INDICATOR ── */
.lumi-scroll-hint {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  animation: lumiFloat 3s ease-in-out infinite;
  opacity: 0;
  animation: lumiReveal 2s ease 0.5s forwards, lumiFloat 3s ease-in-out 2.5s infinite;
}

@keyframes lumiReveal {
  0%   { opacity: 0; transform: translateX(-50%) translateY(16px); filter: blur(6px); }
  100% { opacity: 1; transform: translateX(-50%) translateY(0);    filter: blur(0); }
}

@keyframes lumiFloat {
  0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.3; }
  50%      { transform: translateX(-50%) translateY(8px); opacity: 0.7; }
}

.lumi-scroll-hint svg {
  width: 40px;
  height: 40px;
}

/* ── CTA SECTION (below hero, above footer) ── */
.lumi-cta-section {
  position: relative;
  background: linear-gradient(180deg, #000000 0%, #050000 50%, #000000 100%);
  padding: 80px 24px 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
  text-align: center;
}

.lumi-cta-badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: 'Visby', sans-serif;
  font-size: 14px;
  letter-spacing: 0.05em;
  color: rgba(255,255,255,0.7);
  padding: 10px 28px;
  border-radius: 100px;
  border: 1px solid rgba(255, 50, 50, 0.15);
  background: rgba(255,255,255,0.02);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: default;
}

.lumi-cta-badge:hover {
  border-color: rgba(255, 50, 50, 0.4);
  background: rgba(255,255,255,0.05);
  box-shadow: 0 0 20px rgba(255, 0, 0, 0.08);
}

.lumi-cta-badge-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: linear-gradient(135deg, #6a0000, #ff1a1a);
  animation: lumiBadgePulse 2.5s ease-in-out infinite;
}

@keyframes lumiBadgePulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.5; transform: scale(0.6); }
}

.lumi-cta-title {
  font-family: 'Visby', sans-serif;
  font-size: clamp(28px, 4vw, 48px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.15;
  margin: 0;
  /* Degradê Vermelho Lumi (Desktop & Mobile) */
  background: linear-gradient(135deg, #ff4500, #ff1a1a, #990000);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-fill-color: transparent;
}

.lumi-cta-subtitle {
  font-family: 'Visby', sans-serif;
  font-size: clamp(14px, 1.4vw, 18px);
  color: rgba(255,255,255,0.4);
  max-width: 520px;
  line-height: 1.7;
  margin: 0;
  font-weight: 400;
}

/* CTA card with the orcamento image */
.lumi-cta-card {
  position: relative;
  max-width: 700px;
  width: 100%;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.06);
  transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: pointer;
  margin-top: 20px;
}

/* ── MODERN SCROLL ANIMATIONS ── */
.scroll-topo, .scroll-base, .scroll-zoom, .scroll-esquerda, .scroll-direita {
  opacity: 0;
  transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  will-change: opacity, transform, filter;
}

.scroll-topo { transform: translateY(40px); }
.scroll-topo.ativo { opacity: 1; transform: translateY(0); }

.scroll-base { transform: translateY(-40px); }
.scroll-base.ativo { opacity: 1; transform: translateY(0); }

.scroll-zoom { transform: scale(0.9); filter: blur(5px); }
.scroll-zoom.ativo { opacity: 1; transform: scale(1); filter: blur(0); }

.scroll-esquerda { transform: translateX(-40px); }
.scroll-esquerda.ativo { opacity: 1; transform: translateX(0); }

.scroll-direita { transform: translateX(40px); }
.scroll-direita.ativo { opacity: 1; transform: translateX(0); }

.delay-2 { transition-delay: 0.2s; }

/* ── ORGANIC FLOATING FOR CTA ── */
.lumi-organic-float {
  animation: organicFloat 6s ease-in-out infinite;
}

@keyframes organicFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(0.5deg); }
}

/* ── PULSATING AURA FOR CTA & BUTTONS ── */
.lumi-aura {
  position: relative;
  z-index: 1;
}
.lumi-aura::after {
  content: '';
  position: absolute;
  top: -2px; left: -2px; right: -2px; bottom: -2px;
  background: linear-gradient(45deg, #ff4500, #ff1a1a, transparent, #ff4500);
  background-size: 400%;
  z-index: -1;
  filter: blur(12px);
  opacity: 0.6;
  border-radius: inherit;
  transition: opacity 0.5s ease;
  animation: glowingAura 12s linear infinite;
}
.lumi-aura:hover::after {
  opacity: 1;
}

@keyframes glowingAura {
  0% { background-position: 0 0; }
  50% { background-position: 400% 0; }
  100% { background-position: 0 0; }
}

.lumi-cta-card:hover {
  transform: translateY(-6px) scale(1.02);
  border-color: rgba(255, 50, 50, 0.4);
  box-shadow: 0 20px 60px rgba(255, 0, 0, 0.15), 0 8px 24px rgba(0,0,0,0.8);

<script>window.addEventListener('DOMContentLoaded', function() {
  var Stars = {
    canvas: null,
    context: null,
    circleArray: [],
    colorArray: ['#ff0000', '#ff1a1a', '#e60000', '#cc0000', '#ff3333'],
    mouseDistance: 100,
    mouse: { x: undefined, y: undefined },
    
    init: function () {
      this.canvas = document.getElementById('stars');
      this.canvas.width = window.innerWidth;
      this.canvas.height = window.innerHeight;
      this.canvas.style.display = 'block';
      this.context = this.canvas.getContext('2d');
      
      window.addEventListener('mousemove', this.mouseMove.bind(this));
      window.addEventListener('resize', this.resize.bind(this));
      this.prepare();
      this.animate();
    },
    
    Circle: function (x, y, radius, fill) {
      this.x = x;
      this.y = y;
      this.baseX = x;
      this.radius = radius;
      this.fill = fill;
      this.speedY = -(Math.random() * 1.5 + 0.5);
      this.wobbleSpeed = Math.random() * 0.02 + 0.01;
      this.wobbleDistance = Math.random() * 20 + 10;
      this.angle = Math.random() * Math.PI * 2;
      this.life = 0;
      this.maxLife = Math.random() * 200 + 100;
      this.opacity = 0;
      
      this.draw = function () {
        Stars.context.save();
        Stars.context.globalAlpha = this.opacity;
        Stars.context.beginPath();
        Stars.context.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
        Stars.context.fillStyle = this.fill;
        Stars.context.shadowBlur = this.radius * 4;
        Stars.context.shadowColor = this.fill;
        Stars.context.fill();
        Stars.context.restore();
      };
      
      this.update = function () {
        this.life++;
        
        if (this.life < 50) {
          this.opacity = this.life / 50;
        } else if (this.life > this.maxLife - 50) {
          this.opacity = (this.maxLife - this.life) / 50;
        } else {
          this.opacity = 1;
        }
        
        this.y += this.speedY;
        this.angle += this.wobbleSpeed;
        this.x = this.baseX + Math.sin(this.angle) * this.wobbleDistance;
        
        if (Stars.mouse.x !== undefined) {
          var dx = Stars.mouse.x - this.x;
          var dy = Stars.mouse.y - this.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < Stars.mouseDistance) {
            this.x -= dx * 0.05;
            this.baseX -= dx * 0.05;
            this.y -= dy * 0.05;
          }
        }
        
        if (this.life >= this.maxLife || this.y < -10) {
          this.reset();
        }
        
        this.draw();
      };
      
      this.reset = function() {
        this.y = Stars.canvas.height + 10;
        this.baseX = Math.random() * Stars.canvas.width;
        this.x = this.baseX;
        this.life = 0;
        this.maxLife = Math.random() * 200 + 100;
        this.speedY = -(Math.random() * 1.5 + 0.5);
      };
    },
    
    prepare: function () {
      this.circleArray = [];
      var isMobile = window.innerWidth < 768;
      var numStars = isMobile ? 350 : 600; 
      
      for (var i = 0; i < numStars; i++) {
        var radius = Math.random() * (isMobile ? 2.5 : 1.5) + 0.5;
        var x = Math.random() * this.canvas.width;
        var y = Math.random() * this.canvas.height;
        var fill = this.colorArray[Math.floor(Math.random() * this.colorArray.length)];
        
        var circle = new this.Circle(x, y, radius, fill);
        circle.life = Math.random() * circle.maxLife;
        this.circleArray.push(circle);
      }
    },
    
    animate: function () {
      requestAnimationFrame(Stars.animate.bind(Stars));
      Stars.context.clearRect(0, 0, Stars.canvas.width, Stars.canvas.height);
      
      for (var i = 0; i < Stars.circleArray.length; i++) {
        Stars.circleArray[i].update();
      }
    },
    
    mouseMove: function (event) {
      this.mouse.x = event.x;
      this.mouse.y = event.y;
    },
    
    resize: function () {
      this.canvas.width = window.innerWidth;
      this.canvas.height = window.innerHeight;
      this.prepare(); 
    }
  };
  
  $(document).ready(function () {
    Stars.init();
  });
});</script>
